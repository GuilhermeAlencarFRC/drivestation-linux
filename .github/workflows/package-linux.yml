name: Linux alpha test package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build tested Linux archive
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Qt and build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y cmake ninja-build g++ qt6-base-dev libsdl2-dev
      - name: Build and test
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
      - name: Assemble archive
        run: |
          cpack --config build/CPackConfig.cmake -G TGZ -B dist
      - name: Verify extracted alpha
        run: |
          for archive in dist/*-TESTES.tar.gz; do
            python3 packaging/verify-alpha.py "$archive" "$RUNNER_TEMP/alpha extraction" > dist/verification.json
          done
      - name: Upload package and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: drivestation-linux-alpha-TESTES
          path: |
            dist/*-TESTES.tar.gz
            dist/*-TESTES.tar.gz.sha256
            dist/verification.json
          if-no-files-found: error
          retention-days: 30
